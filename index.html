<!doctype html>
<html lang="en">
  <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Out Of This World — Consciousness Infrastructure</title>
    <meta name="description" content="An integrated ecosystem for consciousness, wellness, and human evolution. We build the bridge between inner transformation and real-world systems." />
  
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  
    <style>
      /* OOTW.CO — Brand System v3 */

      :root {
          /* Core palette */
          --void: #07060B;
          --void-deep: #030208;
          --cosmos: #14122A;
          --cosmos-2: #1B1840;
          --paper: #F4EFE6;
          --paper-dim: #DCD5C7;
          --magenta: #E5197F;
          --magenta-soft: #FF4FA3;
          --teal: #1FD9C7;
          --teal-soft: #6FF0E2;
          --gold: #D9B45B;
          --gold-soft: #F0CE7A;

          /* Tokens */
          --bg: var(--void);
          --fg: var(--paper);
          --muted: rgba(244, 239, 230, 0.55);
          --hairline: rgba(244, 239, 230, 0.12);
          --hairline-strong: rgba(244, 239, 230, 0.28);

          /* Type */
          --font-display: "Newsreader", "Cormorant Garamond", "Times New Roman", serif;
          --font-body: "Inter Tight", system-ui, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, monospace;

          /* Scale */
          --tracking-tight: -0.04em;
          --tracking-mono: 0.16em;
          --radius: 0px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
          background: var(--bg);
          color: var(--fg);
          font-family: var(--font-body);
          font-feature-settings: "ss01", "cv11";
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          overflow-x: hidden;
          scroll-behavior: smooth;
      }

      body {
          font-size: 16px;
          line-height: 1.5;
          letter-spacing: -0.005em;
          cursor: none;
      }
    </style></title>
  </head>
